<html lang="it">
    <head>
        <!-- Configurazione tecnica -->

        <!-- Titolo pagina -->

        <!-- SEO -->
        <meta name="description" content="Sito personale di Thomas, giovane sviluppatore di 13 anni. per PAGINA IN VIA DI SVILUPPO!">
        <meta name="author" content="Thomas">
        <meta name="robots" content="noindex, follow">

        <!-- Social preview -->
        <meta property="og:title" content="Pagina in costruzione">
        <meta property="og:description" content="Questa pagina del sito di Thomas è ancora in fase di sviluppo.">
        <meta property="og:image" content="https://thomas.thobttl.it/thomaslogo.png">
        <meta property="og:url" content="https://thomas.thobttl.it/">
        <meta property="og:type" content="website">
        <meta property="og:locale" content="it_IT">

        <!-- Twitter / X -->
        <meta name="twitter:card" content="summary_large_image">
        <meta property="og:title" content="Pagina in costruzione">
        <meta property="og:description" content="Questa pagina del sito di Thomas è ancora in fase di sviluppo.">
        <meta name="twitter:image" content="https://thomas.thobttl.it/thomaslogo.png">

        <!-- Icone -->
        <link rel="icon" href="thomaslogo.png" type="image/png">
        <link rel="apple-touch-icon" href="thomaslogo.png">

        <!-- Colore browser -->
        <meta name="theme-color" content="#93C47D">

        <style>
            body {
                margin: 0;
                position: relative;
                height:100vh;
                display:flex;
                justify-content:center;
                align-items:center;
            }

            body::before {
                content: "";
                position: fixed;
                inset: 0;

                background-image: url("schermi.jpg");
                background-size: cover;
                background-position: center;

                filter: blur(40px);
                opacity: 0.9;

                z-index: -2;
            }

            body::after {
                content: "";
                position: fixed;
                inset: 0;

                background: rgba(20, 20, 45, 0.6); /* colore del blur */

                z-index: -1;
            }
            #wip{
                text-align:center;
                font-family:Arial, sans-serif;
                color:white;
            }

            #wip h1{
                font-size:70px;
                margin-bottom:20px;
                text-shadow:0 0 20px rgba(0,0,0,0.7);
            }
            #cantiere{
                font-size:28px;
                font-weight:bold;
                padding:10px 25px;

                background: repeating-linear-gradient(
                    45deg,
                    #ff8c00,
                    #ff8c00 20px,
                    #000 20px,
                    #000 40px
                );

                color:white;
                display:inline-block;
                border-radius:6px;
                letter-spacing:3px;
            }
            #cartello-indietro{
                position: fixed;
                top: 30px;
                left: 30px;

                padding: 14px 35px;

                font-family: Arial, sans-serif;
                font-weight: bold;
                font-size: 20px;
                letter-spacing: 3px;

                color: white;
                text-decoration: none;

                background: repeating-linear-gradient(
                    45deg,
                    #ff8c00,
                    #ff8c00 18px,
                    #000 18px,
                    #000 36px
                );

                border: 4px solid #222;
                border-radius: 8px;

                transform: rotate(-7deg);

                box-shadow:
                    0 10px 25px rgba(0,0,0,0.6),
                    inset 0 0 12px rgba(0,0,0,0.5);

                transition: 0.25s;
            }

            #cartello-indietro span{
                position: relative;
                z-index: 2;
            }

            #cartello-indietro:hover{
                transform: rotate(-2deg) scale(1.08);
            }

            #cartello-indietro::before,
            #cartello-indietro::after{
                content:"";
                position:absolute;
                width:10px;
                height:10px;
                background:#bbb;
                border-radius:50%;
                border:2px solid #444;
                box-shadow: inset 0 0 3px #000;
            }

            #cartello-indietro::before{
                top:5px;
                left:5px;
            }

            #cartello-indietro::after{
                bottom:5px;
                right:5px;
            }
        </style>
    </head>
    <body>

        <a href="index.html" id="cartello-indietro">
            <span>INDIETRO</span>
        </a>

        <div id="wip">
            <h1>PAGINA NON ANCORA PRONTA</h1>
            <div id="cantiere">WORK IN PROGRESS</div>
        </div>

    </body>
</html>
